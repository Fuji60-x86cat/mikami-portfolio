<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
      検索エンジンへのインデックス方針は未定とのことなので、ひとまず未設定にしています。
      ポートフォリオ本体と揃えて noindex にしたい場合は、下記のコメントアウトを外してください。
      <meta name="robots" content="noindex, nofollow">
    -->

    <!--
      外部リソースは Google Fonts と Font Awesome (cdnjs) のみ許可。
      アバター画像はリポジトリ内（images/avatar.jpg）に置くようにしたため、img-src は 'self' のみに絞っています。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>三上風侍朗 - Links</title>

    <!-- フォントの読み込み (Playfair Display for headings, Lora for body) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">

    <!--
      アイコン用のFont Awesome。
      SRI(整合性検証)ハッシュは https://www.srihash.org/ に上記URLを貼り付けると自動生成できます。
      生成した値を integrity="sha512-xxxxxxxx..." の形で追加してください（誤ったハッシュ値を書くと読み込み自体が失敗するため、必ず実際に生成した値を使ってください）。
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 温かみのあるクリーム色の背景とコーヒーの染みのようなテクスチャ */
            background-color: #fdfcf0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(161, 130, 98, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(161, 130, 98, 0.05) 0%, transparent 50%);
            color: #5d4037; /* ダークブラウンのテキスト */
            font-family: 'Lora', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景の有機的な装飾（元の円をコーヒーの染みに見立てる） */
        .bg-decoration {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 100%;
            background-image: 
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><path d="M200 10C90.5 10 1 99.5 1 209s89.5 199 199 199 199-89.5 199-199S309.5 10 200 10zm0 382C99.4 392 18 309.6 18 209S99.4 26 200 26s182 82.4 182 183-82.4 183-182 183z" fill="%23a18262" fill-opacity="0.06"/></svg>'),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><path d="M150 10C71.6 10 8 73.6 8 152s63.6 142 142 142 142-63.6 142-142S228.4 10 150 10zm0 268C80.8 278 24 221.2 24 152S80.8 26 150 26s126 56.8 126 126-56.8 126-126 126z" fill="%23a18262" fill-opacity="0.08"/></svg>');
            background-repeat: no-repeat;
            background-position: -100px -100px, 400px 200px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* プロフィール画像 (カフェのアイコン) */
        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffffff; /* 白い縁取り */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            background-color: #ffffff;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ヘッダー情報 */
        .links-label {
            font-family: 'Lora', serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #a18262; /* アクセントカラー */
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #3e2723; /* 濃いブラウン */
        }

        .username {
            font-family: 'Lora', serif;
            font-size: 16px;
            color: #6d4c41;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .status {
            font-family: 'Lora', serif;
            font-size: 14px;
            color: #8d6e63;
            margin-bottom: 48px;
            font-style: italic;
        }

        /* リンクカード一覧 */
        .link-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff; /* 白いカード */
            border: 1px solid #e0e0e0;
            padding: 20px 24px;
            border-radius: 16px; /* 大きな角丸 */
            text-decoration: none;
            color: #5d4037;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .link-card:hover {
            background-color: #fff8e1; /* ホバーで薄い黄色 */
            border-color: #ffe082;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        .link-left {
            display: flex;
            align-items: center;
        }

        .link-title {
            font-size: 17px;
            font-weight: 600;
        }

        .link-arrow {
            font-size: 16px;
            color: #bdbdbd;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .link-card:hover .link-arrow {
            color: #5d4037;
            transform: translateX(3px); /* ホバーで矢印が少し動く */
        }
    </style>
</head>
<body>

    <!-- 背景の装飾（コーヒーの染み風） -->
    <div class="bg-decoration"></div>

    <div class="container">
        <!--
          プロフィールアイコン（ラテアート画像）。
          リポジトリの images/avatar.jpg を読み込んでいます。アップロード時のファイル名を変えた場合はここも合わせて変更してください。
        -->
        <div class="avatar-container">
            <img src="images/avatar.jpg" alt="Cafe Logo / Latte Art">
        </div>

        <div class="links-label">ポートフォリオ</div>
        <h1>三上風侍朗</h1>
        <div class="username">これはリンク集です</div>
        <div class="status"></div>

        <!-- リンクカード群 -->
        <div class="link-list">
            <!-- 1. Qiita -->
            <a href="https://qiita.com/x86cat" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <span class="link-title">Qiita</span>
                </div>
                <div class="link-arrow"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- 2. note -->
            <a href="https://note.com/limber_auklet93" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <span class="link-title">note</span>
                </div>
                <div class="link-arrow"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- 3. GitHub -->
            <a href="https://github.com/Fuji60-x86cat" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <span class="link-title">GitHub</span>
                </div>
                <div class="link-arrow"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- 4. X -->
            <a href="https://x.com/YamadaTaromlok" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <span class="link-title">X</span>
                </div>
                <div class="link-arrow"><i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!--
              5. ポートフォリオサイト本体
              元コードでは note.com への重複リンクになっていました。
              ホスティング先が決まったら、下記 href を本体サイトのURLに置き換えてください。
            -->
            <a href="https://fuji60-x86cat.github.io/mikami-portfolio/" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-left">
                    <span class="link-title">三上風侍朗のポートフォリオサイト</span>
                </div>
                <div class="link-arrow"><i class="fa-solid fa-arrow-right"></i></div>
            </a>
        </div>
    </div>

</body>
</html>
